name: Fern check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Fern CLI
        uses: fern-api/setup-fern-cli@v1

      - name: Validate documentation
        run: fern check
