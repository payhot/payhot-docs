          type: string
          pattern: ^(0|[1-9][0-9]*)$
        merchant_fee_minor:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
        payer_fee_minor:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
        merchant_net_minor:
          $ref: '#/components/schemas/PositiveInt64DecimalString'
    CashDeskIdentity:
      type: object
      additionalProperties: false
      required:
      - id
      - code
      - display_name
      description: Безопасный для мерчанта идентификатор кассы.
      properties:
        id:
          $ref: '#/components/schemas/LowercaseUUID'
        code:
          type: string
          minLength: 3
          maxLength: 64
          pattern: ^[a-z][a-z0-9_-]{2,63}$
        display_name:
          type: string
          minLength: 2
          maxLength: 160
    PaymentAmountDenomination:
      description: Валюта и масштаб суммы, указанной мерчантом.
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - money_unit_code
        - unit_kind
        - exponent
        properties:
          money_unit_code:
            $ref: '#/components/schemas/FiatCurrency'
          unit_kind:
            type: string
            enum:
            - fiat
          exponent:
            type: integer
            enum:
            - 2
      - type: object
        additionalProperties: false
        required:
        - money_unit_code
        - unit_kind
        - asset
        - network
        - exponent
        properties:
          money_unit_code:
            type: string
            enum:
            - USDT.TRON
          unit_kind:
            type: string
            enum:
            - crypto
          asset:
            type: string
            enum:
            - USDT
          network:
            type: string
            enum:
            - TRON
          exponent:
            type: integer
            enum:
            - 6
    DateTime:
      type: string
      format: date-time
    APIError:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - details
      - request_id
      - retryable
      - action
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        details:
          type: object
          additionalProperties: true
        request_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$
        retryable:
          type: boolean
          description: Можно ли безопасно повторить запрос автоматически.
        action:
          type: string
          enum:
          - authenticate
          - refresh
          - retry_later
          - correct_request
          - check_request
          - contact_support
          description: Рекомендуемое действие для исправления ошибки без внутренних данных обработки.
    DirectSBPNextAction:
      type: object
      additionalProperties: false
      required:
      - type
      - url
      - expires_at
      properties:
        type:
          type: string
          enum:
          - sbp_qr
        url:
          type: string
          format: uri
          maxLength: 4096
          pattern: ^https://qr[.]nspk[.]ru/[A-Za-z0-9]+(?:[?][^#\s]*)?$
          description: Ссылка СБП для оплаты созданного платежа. Её наличие ещё не подтверждает оплату.
        expires_at:
          $ref: '#/components/schemas/DateTime'
    MvpCurrencyProjection:
      oneOf:
      - type: object
        required:
        - currency
        - money_unit_exponent
        properties:
          currency:
            $ref: '#/components/schemas/FiatCurrency'
          money_unit_exponent:
            enum:
            - 2
      - type: object
        required:
        - currency
        - money_unit_exponent
        properties:
          currency:
            enum:
            - USDT.TRON
          money_unit_exponent:
            enum:
            - 6
    AtomicAmountString:
      type: string
      minLength: 1
      maxLength: 38
      pattern: ^(0|[1-9][0-9]{0,37})$
      description: Неотрицательная сумма в минимальных единицах, переданная строкой.
    PayoutMoneyUnitCode:
      $ref: '#/components/schemas/MvpMoneyUnit'
    PublicPayoutStatus:
      type: string
      enum:
      - processing
      - succeeded
      - failed
      - cancelled
      description: processing означает, что PayHot принял выплату и выполняет необходимые внутренние этапы. Итоговые состояния
        — succeeded, failed или cancelled.
    MvpMoneyUnitCodeProjection:
      oneOf:
      - type: object
        required:
        - money_unit_code
        - money_unit_exponent
        properties:
          money_unit_code:
            $ref: '#/components/schemas/FiatCurrency'
          money_unit_exponent:
            enum:
            - 2
      - type: object
        required:
        - money_unit_code
        - money_unit_exponent
        properties:
          money_unit_code:
            enum:
            - USDT.TRON
          money_unit_exponent:
            enum:
            - 6
    FiatCurrency:
      type: string
      enum:
      - RUB
      - USD
      - EUR
  headers:
    RequestID:
      description: Идентификатор запроса для обращения в поддержку PayHot.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$
    RetryAfter:
      description: Минимальная задержка перед повтором в секундах.
      schema:
        type: string
        pattern: ^[0-9]+$
  responses:
    ErrorResponse:
      description: Ошибка с кодом и пояснением.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    MerchantAuthenticationError:
      description: API-ключ отсутствует, недействителен или истёк.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        WWW-Authenticate:
          schema:
            type: string
            enum:
            - Bearer realm="payhot-v2"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RetryableError:
      description: Временная ошибка операции или зависимого сервиса.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PaymentLifecycleUnprocessableError:
      description: Операция не может быть выполнена в текущем состоянии платежа.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Idempotency-Replayed:
          description: Повтор уже сохранённого результата операции.
          schema:
            type: string
            enum:
            - 'true'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PayoutCreationConflictError:
      description: Недостаточно доступных средств или конфликт номера, состояния либо ключа повтора.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Retry-After:
          description: Время ожидания перед повтором при обработке запроса с тем же ключом.
          schema:
            type: string
            enum:
            - '1'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
