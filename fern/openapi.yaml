openapi: 3.1.0
info:
  title: PayHot API
  version: 2.0.0
  description: Публичный API PayHot для платежей, выплат, повторных списаний и получения баланса проекта.
servers:
- url: https://app.pay.hot
  x-fern-server-name: Production
tags:
- name: Платежи
  description: Создание платежей и проверка их состояния.
- name: Выплаты
  description: Создание выплат и проверка их состояния.
- name: Повторные платежи
  description: Привязка способа оплаты и повторные списания.
- name: Балансы
  description: Баланс проекта.
paths:
  /api/v2/payments:
    post:
      operationId: createPayment
      summary: Создать платёж
      description: Создаёт платёж и одноразовую ссылку Checkout PayHot. Касса определяется API-ключом. Повтор с тем же Idempotency-Key
        возвращает результат исходного запроса.
      tags:
      - Платежи
      security:
      - MerchantBearer: []
      parameters:
      - $ref: '#/components/parameters/StrongIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
            examples:
              sbpRUB:
                summary: 100 RUB через СБП
                value:
                  merchant_order_reference: order-sbp-1
                  amount_minor: '10000'
                  currency: RUB
                  payment_method: sbp
              cardRUB:
                summary: 100 RUB по карте
                value:
                  merchant_order_reference: order-card-1
                  amount_minor: '10000'
                  currency: RUB
                  payment_method: card
              cardEUR:
                summary: 10 EUR по карте
                value:
                  merchant_order_reference: order-card-eur-1
                  amount_minor: '1000'
                  currency: EUR
                  payment_method: card
              sberPayRUB:
                summary: 100 RUB через SberPay
                value:
                  merchant_order_reference: order-sberpay-1
                  amount_minor: '10000'
                  currency: RUB
                  payment_method: sberpay
                  customer:
                    id: customer-4
                    phone: '+79991234567'
                    sberpay:
                      front_type: back2app
              rubCryptoPayerSelects:
                summary: Сумма в RUB, выбор криптовалюты плательщиком
                value:
                  merchant_order_reference: order-rub-crypto-1
                  amount_minor: '10000'
                  currency: RUB
                  payment_method: crypto
              rubCryptoNetworkLocked:
                summary: Сумма в RUB, сеть TRON задана
                value:
                  merchant_order_reference: order-rub-crypto-2
                  amount_minor: '10000'
                  currency: RUB
                  payment_method: crypto
                  crypto:
                    network: TRON
              exactUSDT:
                summary: Точная сумма USDT в сети TRON
                value:
                  merchant_order_reference: order-usdt-1
                  amount_minor: '10000000'
                  currency: USDT.TRON
                  payment_method: crypto
      responses:
        '201':
          description: Платёж создан или безопасно возвращён результат повтора.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Idempotency-Replayed:
              description: Присутствует только при повторе запроса.
              schema:
                type: string
                enum:
                - 'true'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/PaymentCheckoutGrant'
                - $ref: '#/components/schemas/PaymentReplay'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/MerchantAuthenticationError'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '415':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/RetryableError'
  /api/v2/payments/{payment_id}:
    parameters:
    - $ref: '#/components/parameters/PaymentID'
    get:
      operationId: getPayment
      summary: Получить статус платежа
      description: Возвращает текущее состояние платежа, созданного для проекта и кассы этого API-ключа. Итог подтверждайте
        статусом или подписанным вебхуком.
      tags:
      - Платежи
      security:
      - MerchantBearer: []
      responses:
        '200':
          description: Запрос выполнен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentEnvelope'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/MerchantAuthenticationError'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/RetryableError'
  /api/v2/payments/{payment_id}/direct-sbp-action:
    parameters:
    - $ref: '#/components/parameters/PaymentID'
    get:
      operationId: getDirectSBPAction
      summary: Получить прямую ссылку СБП
      description: Для уже созданного платежа СБП возвращает состояние прямой QR-ссылки. Разрешение включает администратор
        PayHot для конкретного боевого API-ключа и кассы. hosted_checkout_required означает переход через Checkout PayHot,
        pending — ссылку ещё готовят, available — ссылка готова до expires_at, expired — срок истёк. available не подтверждает
        оплату; итог проверяйте по статусу платежа или вебхуку.
      tags:
      - Платежи
      security:
      - MerchantBearer: []
      responses:
        '200':
          description: Текущее состояние прямой ссылки СБП. Ответ не подтверждает оплату.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectSBPActionEnvelope'
        '401':
          $ref: '#/components/responses/MerchantAuthenticationError'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/RetryableError'
  /api/v2/payments/{payment_id}/refunds:
    parameters:
    - $ref: '#/components/parameters/PaymentLifecyclePaymentID'
    post:
      operationId: refundPayment
      summary: Возврат платежа
      deprecated: true
      description: Создание возврата через API мерчанта пока недоступно. Возврат средств выполняется через менеджеров PayHot.
        Адрес возвращает 403 без создания операции.
      tags:
      - Платежи
      security:
      - MerchantBearer: []
      parameters:
      - $ref: '#/components/parameters/StrongIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentLifecycleAmountRequest'
      responses:
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/MerchantAuthenticationError'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '415':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/PaymentLifecycleUnprocessableError'
        '503':
          $ref: '#/components/responses/RetryableError'
  /api/v2/payouts:
    post:
      operationId: createPayout
      summary: Выплаты
      description: Создаёт выплату с рублёвого баланса проекта. Сумма указывается в копейках RUB, реквизиты карты или СБП
        передаются только в этом запросе. Криптовалютные выплаты пока недоступны. Повторяйте запрос с тем же Idempotency-Key.
      tags:
      - Выплаты
      security:
      - MerchantBearer: []
      parameters:
      - $ref: '#/components/parameters/StrongIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerPayoutRequest'
            examples:
              card:
                summary: Выплата на карту
                value:
                  merchant_payout_reference: payout-1001
                  amount_minor: '12000'
                  currency: RUB
                  recipient:
                    method: card
                    card_number: '4111111111111111'
                    first_name: Иван
                    last_name: Иванов
                    email: ivan@example.com
                    payeer_identifier: recipient-1001
              sbp:
                summary: Выплата через СБП
                value:
                  merchant_payout_reference: payout-1002
                  amount_minor: '12000'
                  currency: RUB
                  recipient:
                    method: sbp
                    phone: '+79991234567'
                    bank_id: '100000000001'
                    card_holder: Иван Иванов
                    payeer_identifier: recipient-1002
      responses:
        '201':
          description: Выплата создана или безопасно возвращён результат повтора.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Idempotency-Replayed:
              description: Присутствует только при повторе запроса.
              schema:
                type: string
                enum:
                - 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutEnvelope'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/MerchantAuthenticationError'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/PayoutCreationConflictError'
        '415':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/RetryableError'
  /api/v2/payouts/{payout_id}:
    parameters:
    - $ref: '#/components/parameters/PayoutID'
    get:
      operationId: getPayout
      summary: Получить статус выплаты
      description: Показывает состояние выплаты проекта без полного номера карты и других реквизитов получателя.
      tags:
      - Выплаты
      security:
      - MerchantBearer: []
      responses:
        '200':
          description: Текущее состояние выплаты проекта.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutEnvelope'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/MerchantAuthenticationError'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/RetryableError'
  /api/v2/recurring-enrollment-sessions:
    post:
      operationId: createRecurringEnrollmentSession
      summary: Привязать карту или СБП
      description: Создаёт защищённую ссылку PayHot для привязки карты или СБП. Передайте ссылку плательщику; после успешного
        подтверждения PayHot активирует бессрочное разрешение и вернёт mandate_id. Привязка действует до отзыва. Внутренний
        сценарий работы с провайдером выбирает PayHot.
      tags:
      - Повторные платежи
      security:
      - MerchantBearer: []
      parameters:
      - $ref: '#/components/parameters/StrongIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecurringEnrollmentRequest'
            examples:
              card:
                summary: Привязка карты
                value:
                  payment_method: card
                  merchant_mandate_reference: subscription-1001
                  customer_reference: customer-1001
              sbp:
                summary: Привязка СБП
                value:
                  payment_method: sbp
                  merchant_mandate_reference: subscription-1002
                  customer_reference: customer-1002
      responses:
        '201':
          description: Создана ссылка для подтверждения привязки карты или СБП.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantRecurringEnrollmentGrant'
              examples:
                card:
                  summary: Ссылка для привязки карты
                  value:
                    recurring_enrollment:
                      status: processing
                      currency: RUB
                      payment_method: card
                      merchant_mandate_reference: subscription-1001
                      expires_at: '2026-09-22T18:30:00Z'
                    checkout_url: /pay/75555555-5555-4555-8555-555555555555#token=phc_v2.AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                sbp:
                  summary: Ссылка для привязки СБП
                  value:
                    recurring_enrollment:
                      status: processing
                      currency: RUB
                      payment_method: sbp
                      merchant_mandate_reference: subscription-1002
                      expires_at: '2026-09-22T18:30:00Z'
                    checkout_url: /mandate/76666666-6666-4666-8666-666666666666#token=phc_v2.BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/MerchantAuthenticationError'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '415':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/RetryableError'
  /api/v2/mandates/{mandate_id}:
    parameters:
    - $ref: '#/components/parameters/MandateID'
    get:
      operationId: getMandate
      summary: Получить статус привязки
      description: Показывает состояние разрешения на повторные списания по проекту. Полные реквизиты плательщика не возвращаются.
      tags:
      - Повторные платежи
      security:
      - MerchantBearer: []
      responses:
        '200':
          description: Текущее состояние привязки.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MandateEnvelope'
        '401':
          $ref: '#/components/responses/MerchantAuthenticationError'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/RetryableError'
  /api/v2/mandates/{mandate_id}/revoke:
    parameters:
    - $ref: '#/components/parameters/MandateID'
    post:
      operationId: revokeMandate
      summary: Отключить повторные списания
      description: Отзывает разрешение плательщика на будущие списания. Повтор с тем же запросом безопасен.
      tags:
      - Повторные платежи
      security:
      - MerchantBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeMandateRequest'
      responses:
        '200':
          description: Повторные списания отключены.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeMandateResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/MerchantAuthenticationError'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '415':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/RetryableError'
  /api/v2/recurring-charges:
    post:
      operationId: createRecurringCharge
      summary: Создать повторное списание
      description: Принимает одно списание по действующему разрешению плательщика. Ответ 202 означает постановку в обработку,
        а не успешную оплату; итог проверяйте отдельно.
      tags:
      - Повторные платежи
      security:
      - MerchantBearer: []
      parameters:
      - $ref: '#/components/parameters/StrongIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecurringChargeRequest'
      responses:
        '202':
          description: Списание принято в обработку. Итог проверяйте по статусу и вебхуку.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Idempotency-Replayed:
              description: Присутствует только при повторе запроса.
              schema:
                type: string
                enum:
                - 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringChargeEnvelope'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/MerchantAuthenticationError'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '415':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/RetryableError'
  /api/v2/recurring-charges/{charge_id}:
    parameters:
    - $ref: '#/components/parameters/RecurringChargeID'
    get:
      operationId: getRecurringCharge
      summary: Получить повторное списание
      tags:
      - Повторные платежи
      security:
      - MerchantBearer: []
      responses:
        '200':
          description: Текущее состояние повторного списания.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringChargeEnvelope'
        '401':
          $ref: '#/components/responses/MerchantAuthenticationError'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/RetryableError'
      description: Возвращает текущее состояние списания по разрешению плательщика в этом проекте.
  /api/v2/payments/export:
    get:
      operationId: exportMerchantAPIPayments
      summary: Выгрузить платежи
      description: Выгружает платежи проекта за период до 31 дня в CSV, Excel или JSON. Максимум 10 000 строк.
      tags:
      - Платежи
      security:
      - MerchantBearer: []
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: format
        in: query
        required: true
        schema:
          type: string
          enum:
          - csv
          - xlsx
          - json
      responses:
        '200':
          description: Запрос выполнен.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MerchantPaymentExportRow'
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/MerchantAuthenticationError'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/RetryableError'
  /api/v2/balances:
    get:
      operationId: listMerchantAPIBalances
      summary: Получить баланс
      description: Возвращает доступный, удержанный и резервный баланс проекта, к которому привязан API-ключ. Суммы указаны
        в минимальных единицах каждой валюты.
      tags:
      - Балансы
      security:
      - MerchantBearer: []
      responses:
        '200':
          description: Запрос выполнен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantBalancePage'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/MerchantAuthenticationError'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/RetryableError'
components:
  securitySchemes:
    MerchantBearer:
      type: http
      scheme: bearer
      bearerFormat: phk_v2
      description: API-ключ проекта. Сессия кабинета для этого метода не подходит.
  parameters:
    StrongIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Уникальный ключ операции от 16 до 128 печатных символов ASCII. При повторе используйте то же значение.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[!-~]{16,128}$
    PaymentID:
      name: payment_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    PaymentLifecyclePaymentID:
      name: payment_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LowercaseUUID'
    PayoutID:
      name: payout_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    MandateID:
      name: mandate_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    RecurringChargeID:
      name: charge_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
  schemas:
    CreatePaymentRequest:
      type: object
      additionalProperties: false
      required:
      - merchant_order_reference
      - amount_minor
      - currency
      - payment_method
      allOf:
      - $ref: '#/components/schemas/PaymentPayinCombination'
      properties:
        recurring_enrollment:
          type: object
          additionalProperties: false
          description: 'Прежний способ запросить привязку карты вместе с платежом. Для новой интеграции используйте отдельный
            метод привязки карты или СБП: PayHot сам выберет внутренний сценарий и вернёт ссылку подтверждения.'
          properties: {}
        customer:
          type: object
          additionalProperties: false
          required:
          - id
          description: Данные плательщика. Передавайте только поля, нужные для выбранного способа оплаты. Если для привязки
            карты нужен email, плательщик может ввести его в Checkout.
          properties:
            id:
              type: string
