# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: paypal-160815.docs.buildwithfern.com
    custom-domain: docs.pay.hot

title: PayHot API
default-language: curl

layout:
  searchbar-placement: header
  page-width: full
  tabs-placement: header

navigation:
  - api: Документация API
    slug: api
    paginated: true
    display-errors: true
    summary: docs/pages/overview.mdx
    layout:
      - section: Платежи
        referenced-packages:
          - payments
        contents: []
      - section: Выплаты
        referenced-packages:
          - payouts
        contents: []
      - section: Повторные платежи
        referenced-packages:
          - recurring
        contents: []
      - section: Балансы
        referenced-packages:
          - balances
        contents: []

navbar-links:
  - type: minimal
    text: Кабинет
    url: https://app.pay.hot
  - type: filled
    text: Поддержка
    url: https://t.me/payhotsupport_bot

colors:
  accent-primary:
    dark: "#FF8391"
    light: "#A60031"
  background:
    dark: "#15171B"
    light: "#F0F4F8"

theme:
  sidebar: minimal
  body: canvas
  page-actions: toolbar
  footer-nav: minimal

logo:
  dark: docs/assets/logo.svg
  light: docs/assets/logo.svg
  height: 27
  href: https://docs.pay.hot

favicon: docs/assets/favicon.svg
css: styles.css

redirects:
  - source: /api
    destination: /overview
  - source: /api-reference
    destination: /overview
  - source: /first-payment
    destination: /overview
  - source: /payouts
    destination: /overview
  - source: /recurring
    destination: /overview
  - source: /errors-and-retries
    destination: /overview
  - source: /support
    destination: /overview
  - source: /api/справочник-api/payments
    destination: /overview
  - source: /api/справочник-api/payouts
    destination: /overview
  - source: /api/справочник-api/recurring
    destination: /overview
  - source: /api/справочник-api/balances
    destination: /overview

metadata:
  og:dynamic: true
  og:locale: ru_RU
  og:title: PayHot API
  og:description: Публичная документация API PayHot для платежей, выплат, повторных списаний и баланса проекта.
